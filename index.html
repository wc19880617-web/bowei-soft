<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电力建设工程计价系统 · 预规2018版</title><style>
:root{--chrome:#e9eef4;--line:#b9c5d2;--line2:#d8e1ea;--blue:#1b3a5c;--blue2:#2a4a72;--accent:#1f6fbf;--ink:#1f2d3d}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;overflow:hidden;font:12px/1.45 "Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--chrome)}
input,select,textarea,button{font:inherit;color:var(--ink)}
button{cursor:pointer}

/* ── 标题栏 ── */
.titlebar{height:34px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;background:linear-gradient(#2f527d,#1b3a5c);color:#fff;user-select:none}
.titlebar .logo{width:20px;height:20px;display:grid;place-items:center;background:rgba(255,255,255,.16);border-radius:3px;font-size:12px}
.titlebar b{font-size:13px;letter-spacing:.3px}
.titlebar .ver{font-size:11px;color:#a9c4e2}
.titlebar .sp{flex:1}
.win-btns{display:flex}
.win-btn{width:36px;height:34px;display:grid;place-items:center;font-size:12px;color:#d3e2f2;cursor:default}
.win-btn:hover{background:rgba(255,255,255,.15)}
.win-btn.x:hover{background:#c0392b;color:#fff}

/* ── 菜单栏 ── */
.menubar{height:27px;flex:none;display:flex;align-items:stretch;background:#f5f7fa;border-bottom:1px solid var(--line);padding-left:2px}
.menu{position:relative}
.menu>button{height:100%;padding:0 11px;border:0;background:none;font-size:12px}
.menu>button:hover,.menu.open>button{background:#dbe4ef}
.menu-pop{position:absolute;top:100%;left:0;min-width:210px;background:#fff;border:1px solid #9fb0c4;box-shadow:0 10px 26px rgba(15,30,50,.24);z-index:60;padding:4px 0;display:none}
.menu.open .menu-pop{display:block}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 16px;font-size:12px}
.menu-pop button:hover{background:#e8f0fa}
.menu-pop .sep{height:1px;background:var(--line2);margin:4px 0}
.menu-pop .kbd{float:right;color:#8b9aab;font-size:11px}

/* ── 工具条 ── */
.app-toolbar{height:38px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.fld{font-size:11px;color:#5b6e83}
.tb-sep{width:1px;height:20px;background:var(--line2);margin:0 3px;flex:none}
button.btn{height:26px;padding:0 10px;border:1px solid #a9b8c8;background:linear-gradient(#fdfefe,#eef2f7);border-radius:3px;font-size:12px;color:#22303f;flex:none}
button.btn:hover{background:linear-gradient(#fff,#e3ecf6);border-color:#7f9cbb}
button.btn:active{background:#dbe6f2}
button.btn.primary{background:linear-gradient(#3d7dc0,#26629f);border-color:#215889;color:#fff}
button.btn.primary:hover{background:linear-gradient(#4a8ed4,#2a6cad)}
button.primary,.tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* ── 页签 ── */
.tabstrip{height:30px;flex:none;display:flex;align-items:flex-end;gap:2px;padding:0 6px;background:#eef2f7;border-bottom:1px solid var(--line);overflow-x:auto}
.tabstrip button{height:26px;padding:0 16px;border:1px solid var(--line);border-bottom:0;border-radius:3px 3px 0 0;background:#e0e7ef;font-size:12px;color:#33475e;white-space:nowrap;flex:none}
.tabstrip button:hover{background:#e9eff7}
.tabstrip button.active{background:#fff;font-weight:600;color:#12395f;position:relative;top:1px}

/* ── 工作区 ── */
.workbench{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff}
#main{flex:1;min-height:0;display:flex;flex-direction:column;gap:0;padding:6px}
.page{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.split{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr);gap:6px}
.split>section,.split>aside{min-height:0;overflow:auto}
.panel{background:#fff;border:1px solid var(--line);border-radius:2px;display:flex;flex-direction:column;min-height:0;margin:0}
.panel>h2,.panel>h3{margin:0;padding:6px 9px;flex:none;font-size:12px;font-weight:600;color:var(--blue);background:linear-gradient(#eff4fa,#e2eaf3);border-bottom:1px solid #c6d0dc}
.panel>.scroll{flex:1;min-height:0}
.stats{display:flex;flex-wrap:wrap;gap:16px;align-items:center;flex:none;background:linear-gradient(#f6f9fc,#eef3f9);border:1px solid var(--line);border-radius:2px;padding:6px 10px;font-size:12px;color:#33475e}
.stats b{color:var(--blue);font-size:15px;font-variant-numeric:tabular-nums}
.notice{background:#fff9e6;border:1px solid #e8d08a;border-radius:2px;padding:7px 10px;line-height:1.6;font-size:11.5px;color:#6b5312;flex:none}
.notice.error{background:#fdecec;border-color:#e5a9a9;color:#8f2b2b}
.muted{color:#64768a;font-size:11.5px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}
.toolbar h2{font-size:13px;margin:0 4px 0 0;color:var(--blue)}

/* ── 数据网格 ── */
.scroll{overflow:auto;width:100%;border:1px solid var(--line2);border-radius:2px;background:#fff}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px;background:#fff}
th{position:sticky;top:0;z-index:2;background:linear-gradient(#f4f8fc,#e6edf5);border-bottom:1px solid var(--line);border-right:1px solid var(--line2);padding:4px 8px;text-align:left;font-weight:600;color:#22384f;white-space:nowrap}
td{border-bottom:1px solid #e9eef4;border-right:1px solid #f1f5f9;padding:3px 8px;white-space:nowrap;vertical-align:middle}
tbody tr:nth-child(even){background:#fafcfe}
tbody tr:hover{background:#e9f3fd}
tbody tr.total td,.total td{font-weight:700;background:#e9f0f8}
.money{font-variant-numeric:tabular-nums;text-align:right}
td input{width:100%;max-width:170px;border:1px solid transparent;background:transparent;padding:2px 4px;font-size:11.5px}
td input:hover{border-color:#c9d6e4;background:#fff}
td input:focus{border-color:var(--accent);background:#fff;outline:none;box-shadow:0 0 0 2px rgba(31,111,191,.16)}
td input.wide{min-width:150px}
td select{border:1px solid transparent;background:transparent;padding:2px}
input[type=number]{width:95px}
input,select{padding:5px 7px;border:1px solid #b0bfd0;border-radius:3px;background:#fff}
.tb-input{height:26px;padding:0 8px}
#projectName{width:230px}#unitSelect{max-width:270px}

/* ── 树 ── */
.tree-node{border-bottom:1px solid #eef2f7}
.tree-row{display:flex;align-items:center;gap:2px;padding:1px 4px}
.tree-row:hover{background:#eef5fd}
.tree-row.selected{background:#d7e7f8}
.tree-row button{border:0;background:none;padding:3px 6px;border-radius:2px;font-size:11.5px}
.tree-row button:hover{background:#dde8f4}
.tree-row .label{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-row .money{font-size:11px;color:#31506f;padding-right:4px}

/* ── 报表 ── */
.paper-wrap{flex:1;min-height:0;overflow:auto;background:#e9eef4;border:1px solid var(--line);border-radius:2px;padding:14px}
.report{background:#fff;border:1px solid #cfd8e3;box-shadow:0 3px 14px rgba(20,40,70,.12);padding:20px 22px;max-width:1080px;margin:0 auto}
.report h2{text-align:center;margin:4px 0 14px;font-size:15px;color:#12283f}
.report .meta{display:flex;justify-content:space-between;gap:10px;margin:8px 0 10px;font-size:11.5px}
.report footer{display:flex;justify-content:space-between;padding:22px 0 4px;font-size:11.5px;color:#3d5165}
.directory{max-height:none}
.directory button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eef2f7;border-radius:0;background:none;white-space:normal;padding:6px 8px;font-size:11.5px}
.directory button:hover{background:#eef5fd}
.directory button.selected{background:#d7e7f8;font-weight:600}
.directory summary{background:linear-gradient(#eff4fa,#e2eaf3);padding:7px 9px;cursor:pointer;font-weight:600;color:var(--blue);border-bottom:1px solid #c6d0dc}

/* ── 模块窗口（套定额） ── */
.modal{position:fixed;inset:22px;background:#fff;z-index:80;display:flex;flex-direction:column;padding:10px;border:1px solid #7f95ad;border-radius:4px;box-shadow:0 18px 50px rgba(10,25,45,.4)}
.modal .results{overflow:auto;flex:1;border:1px solid var(--line2)}
.modal .results button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eef2f7;border-radius:0;background:none;padding:6px 9px}
.modal .results button:hover{background:#e9f3fd}
.modal .results small{display:block;color:#60748a}
.hidden{display:none!important}
.empty{padding:34px;text-align:center;color:#64768a}
.statusbar{height:24px;flex:none;display:flex;align-items:center;gap:16px;padding:0 10px;background:#e3e9f0;border-top:1px solid var(--line);font-size:11px;color:#3d5165;white-space:nowrap;overflow:hidden}
.error{color:#b32929}
.quota-row{background:#f6f9fc}

@media(max-width:820px){
 body{overflow:auto;height:auto;min-height:100%}
 .workbench,#main{display:block;padding:6px}
 .page{display:block}
 .split{display:block}
 .split>section,.split>aside{margin-bottom:6px;overflow:visible}
 .tree-row button{padding:6px 8px}
 .tabstrip button,.menu>button{padding:0 10px}
 .titlebar .ver{display:none}
 .app-toolbar{height:auto;flex-wrap:wrap;padding:6px}
 #projectName{width:150px}
 .modal{inset:8px}
 .paper-wrap{padding:8px}
}
@media print{
 @page{size:A4 landscape;margin:12mm}
 body{background:#fff;display:block;overflow:visible;height:auto}
 .titlebar,.menubar,.app-toolbar,.tabstrip,.statusbar,.toolbar,.directory,.notice,.no-print,#main>.stats{display:none!important}
 #main,.workbench,.page,.paper-wrap{padding:0;margin:0;border:0;display:block;overflow:visible;max-width:none;background:#fff}
 .split{display:block}.scroll{overflow:visible;border:0}
 table{white-space:normal;font-size:10px}th{background:#eee!important}
 thead{display:table-header-group}tr{break-inside:avoid}
 .report{box-shadow:none;border:0;padding:0;max-width:none}
}
</style></head><body>
<div class="titlebar">
  <span class="logo">⚡</span><b>电力建设工程计价系统</b><span class="ver">电网预规 2018 版 · 自用版 v1.1</span>
  <span class="sp"></span>
  <div class="win-btns"><span class="win-btn">—</span><span class="win-btn">▢</span><span class="win-btn x">✕</span></div>
</div>
<div class="menubar" id="menubar">
  <div class="menu"><button>文件</button><div class="menu-pop">
    <button data-cmd="new">新建工程</button>
    <button data-cmd="import">打开工程（JSON）</button>
    <button data-cmd="save">保存到本机<span class="kbd">Ctrl+S</span></button>
    <button data-cmd="export">另存为 JSON</button>
    <div class="sep"></div>
    <button data-cmd="print">打印 / 导出 PDF<span class="kbd">Ctrl+P</span></button>
  </div></div>
  <div class="menu"><button>编辑</button><div class="menu-pop">
    <button data-cmd="addUnit">新增单位工程</button>
    <button data-cmd="renameUnit">重命名单位工程</button>
    <button data-cmd="addBill">新增清单项</button>
    <button data-cmd="addSibling">新增项目划分（同级）</button>
    <button data-cmd="addChild">新增项目划分（子级）</button>
    <div class="sep"></div>
    <button data-cmd="deleteUnit">删除单位工程</button>
  </div></div>
  <div class="menu"><button>视图</button><div class="menu-pop">
    <button data-cmd="tab:0">工程结构<span class="kbd">F1</span></button>
    <button data-cmd="tab:1">清单编制<span class="kbd">F2</span></button>
    <button data-cmd="tab:2">人材机<span class="kbd">F3</span></button>
    <button data-cmd="tab:3">取费程序<span class="kbd">F4</span></button>
    <button data-cmd="tab:4">报表<span class="kbd">F5</span></button>
  </div></div>
  <div class="menu"><button>计价</button><div class="menu-pop">
    <button data-cmd="openPicker">套定额…</button>
    <button data-cmd="resetFees">按官方费率重置取费</button>
    <button data-cmd="loadExample">载入官方费用示例</button>
    <div class="sep"></div>
    <button data-cmd="addResource">手工人材机</button>
  </div></div>
  <div class="menu"><button>报表</button><div class="menu-pop">
    <button data-cmd="tab:4">报表中心</button>
    <button data-cmd="exportCsv">导出当前报表 CSV</button>
    <button data-cmd="print">打印 / 存 PDF</button>
  </div></div>
  <div class="menu"><button>帮助</button><div class="menu-pop">
    <button data-cmd="about">关于本软件</button>
    <button data-cmd="data">数据来源与口径</button>
  </div></div>
</div>
<div class="app-toolbar">
  <span class="fld">工程名称</span><input id="projectName" class="tb-input" aria-label="工程名称">
  <span class="tb-sep"></span>
  <span class="fld">单位工程</span><select id="unitSelect" class="tb-input" aria-label="单位工程"></select>
  <span class="tb-sep"></span>
  <button id="save" class="btn">保存</button>
  <button id="exportProject" class="btn">另存 JSON</button>
  <button id="importProject" class="btn">导入</button>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
</div>
<div class="tabstrip" id="tabs"></div>
<div class="workbench"><div id="main"></div></div>
<div class="statusbar" id="status"></div>
<div id="picker" class="hidden"></div>
<script>window.APP_ERRORS=[];window.addEventListener('error',e=>APP_ERRORS.push(e.message));window.addEventListener('unhandledrejection',e=>APP_ERRORS.push(String(e.reason)));</script>
<script src="data/data.js?v=6"></script><script src="data/res.js?v=6"></script><script src="data/qufei.js?v=6"></script>
<script src="catalog.js?v=7"></script><script src="calc.js?v=8"></script><script src="app.js?v=15"></script>
<script>
// 桌面式外壳：菜单 / 快捷键
const closeMenus=()=>document.querySelectorAll('.menu').forEach(m=>m.classList.remove('open'));
document.querySelectorAll('.menu>button').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const m=b.parentElement,was=m.classList.contains('open');closeMenus();if(!was)m.classList.add('open');}));
document.addEventListener('click',closeMenus);
function fire(action){const b=document.querySelector('[data-action="'+action+'"]');if(b){b.click();return true;}return false;}
function cmd(c){
 if(c.startsWith('tab:')){const i=Number(c.split(':')[1]);const t=document.querySelector('[data-tab="'+i+'"]');if(t)t.click();return;}
 const B=window.Bowei||{};
 ({new:()=>B.newProject&&B.newProject(),save:()=>{const s=document.getElementById('save');s&&s.click();},
   export:()=>{const b=document.getElementById('exportProject');b&&b.click();},
   import:()=>{const b=document.getElementById('importProject');b&&b.click();},
   print:()=>window.print(),
   addUnit:()=>B.addUnit?B.addUnit():fire('addUnit'),
   renameUnit:()=>fire('renameUnit'),
   addBill:()=>{const t=document.querySelector('[data-tab="1"]');t&&t.click();setTimeout(()=>fire('addBill'),60);},
   addSibling:()=>fire('addSibling'),addChild:()=>fire('addChild'),
   deleteUnit:()=>fire('deleteUnit'),
   openPicker:()=>{const t=document.querySelector('[data-tab="1"]');t&&t.click();setTimeout(()=>{const b=document.querySelector('[data-action="openPicker"]');b?b.click():alert('请先在“清单编制”中新增一个清单项');},60);},
   resetFees:()=>{const t=document.querySelector('[data-tab="3"]');t&&t.click();setTimeout(()=>fire('resetFees'),60);},
   loadExample:()=>fire('loadExample'),
   addResource:()=>{const t=document.querySelector('[data-tab="2"]');t&&t.click();setTimeout(()=>fire('addResource'),60);},
   exportCsv:()=>{const t=document.querySelector('[data-tab="4"]');t&&t.click();setTimeout(()=>fire('exportCsv'),80);},
   data:()=>alert('定额库：2018 年版电力建设工程预算定额 8 个分册，10904 条。\n消耗量：第一册建筑工程 2104 个定额 / 19815 条人材机消耗量（扫描件识别）。\n取费：博微电力建设计价通工程文件内提取的官方取费程序与费率。\n报表：电网预规 2018 版官方模板目录。\n单价：原始资料未含人材机单价，需自行维护预算价与市场价。'),
   about:()=>alert('电力建设工程计价系统 · 自用版 v1.1\n照博微「电力建设计价通」结构重建，支持项目划分树 / 清单 / 定额 / 人材机 / 取费 / 报表。\n数据与公式均为内置，可离线运行。')})[c]?.();
}
document.querySelectorAll('[data-cmd]').forEach(b=>b.addEventListener('click',()=>{closeMenus();cmd(b.dataset.cmd);}));
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();cmd('save');}
 if((e.ctrlKey||e.metaKey)&&e.key==='p'){e.preventDefault();cmd('print');}
 const f={F1:0,F2:1,F3:2,F4:3,F5:4}[e.key];if(f!==undefined){e.preventDefault();cmd('tab:'+f);}
});
</script>
</body></html>
